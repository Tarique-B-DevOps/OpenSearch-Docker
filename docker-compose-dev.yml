services:
  opensearch-dev:
    image: opensearchproject/opensearch:latest
    container_name: opensearch-dev
    environment:
      - cluster.name=${OPENSEARCH_DEV_CLUSTER_NAME}
      - discovery.type=single-node
      - bootstrap.memory_lock=${OPENSEARCH_DEV_BOOTSTRAP_MEMORY_LOCK:-true}
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_DEV_JAVA_OPTS}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-dev-data:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600
    deploy:
      resources:
        limits:
          cpus: ${OPENSEARCH_DEV_CPU_LIMIT}
          memory: ${OPENSEARCH_DEV_MEM_LIMIT}
        reservations:
          cpus: ${OPENSEARCH_DEV_CPU_RESERVATION}
          memory: ${OPENSEARCH_DEV_MEM_RESERVATION}   
    networks:
      - opensearch-dev-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      OPENSEARCH_HOSTS: ${OPENSEARCH_DEV_HOSTS:-'["https://opensearch-dev:9200"]'}
    deploy:
      resources:
        limits:
          cpus: ${OPENSEARCH_DASHBOARD_CPU_LIMIT}
          memory: ${OPENSEARCH_DASHBOARD_MEM_LIMIT}
        reservations:
          cpus: ${OPENSEARCH_DASHBOARD_CPU_RESERVATION}
          memory: ${OPENSEARCH_DASHBOARD_MEM_RESERVATION}
    networks:
      - opensearch-dev-net

volumes:
  opensearch-dev-data:

networks:
  opensearch-dev-net:
    driver: bridge