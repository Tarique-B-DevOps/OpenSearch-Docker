services:
  opensearch-node1:
    image: opensearchproject/opensearch:latest
    container_name: opensearch-node1
    environment:
      - cluster.name=${OPENSEARCH_CLUSTER_NAME:-opensearch-cluster}
      - node.name=${OPENSEARCH_NODE1_NAME:-opensearch-node1}
      - discovery.seed_hosts=${OPENSEARCH_DISCOVERY_SEED_HOSTS:-opensearch-node1,opensearch-node2}
      - cluster.initial_cluster_manager_nodes=${OPENSEARCH_INITIAL_CLUSTER_MANAGER_NODES:-opensearch-node1,opensearch-node2}
      - bootstrap.memory_lock=${OPENSEARCH_BOOTSTRAP_MEMORY_LOCK:-true}
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600
    networks:
      - opensearch-net

  opensearch-node2:
    image: opensearchproject/opensearch:latest
    container_name: opensearch-node2
    environment:
      - cluster.name=${OPENSEARCH_CLUSTER_NAME:-opensearch-cluster}
      - node.name=${OPENSEARCH_NODE2_NAME:-opensearch-node2}
      - discovery.seed_hosts=${OPENSEARCH_DISCOVERY_SEED_HOSTS:-opensearch-node1,opensearch-node2}
      - cluster.initial_cluster_manager_nodes=${OPENSEARCH_INITIAL_CLUSTER_MANAGER_NODES:-opensearch-node1,opensearch-node2}
      - bootstrap.memory_lock=${OPENSEARCH_BOOTSTRAP_MEMORY_LOCK:-true}
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    networks:
      - opensearch-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      OPENSEARCH_HOSTS: ${OPENSEARCH_HOSTS}
    networks:
      - opensearch-net

volumes:
  opensearch-data1:
  opensearch-data2:

networks:
  opensearch-net:
    driver: bridge